name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - android/**
      - app.json
      - package.json
      - package-lock.json
      - assets/**
      - src/**
      - .env.example
      - .github/workflows/android-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Configure public application environment
        run: cp .env.example .env

      - name: Configure Gradle for CI
        working-directory: android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m/' gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' gradle.properties

      - name: Assemble APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -x lintVitalAnalyzeRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cafecom-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
