name: Supabase health check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 */3 * *'

permissions:
  contents: read

jobs:
  check-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

      - name: Query application health
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 \
            --connect-timeout 15 \
            --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/app_health?id=eq.1&select=status")
          test "$response" = '[{"status":"ok"}]'
